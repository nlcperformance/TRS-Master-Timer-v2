<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NLC Master Tactical Timer</title>
    <!-- React & Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-orange': '#ff5500',
                        'brand-orange-glow': 'rgba(255, 85, 0, 0.4)',
                        'tactical-black': '#050505',
                        'tactical-gray': '#111111',
                        'premium-dark': '#0a0a0a',
                        'accent-red': '#EF4444',
                        'eq-blue': '#00d2ff',
                        'eq-purple': '#8a2be2',
                        'eq-pink': '#ff007f',
                        'eq-orange': '#ff7700',
                        'eq-green': '#00ff00',
                    },
                    boxShadow: {
                        'neon-orange': '0 0 20px rgba(255, 85, 0, 0.4), 0 0 40px rgba(255, 85, 0, 0.1)',
                        'neon-white': '0 0 15px rgba(255, 255, 255, 0.2)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700;800&family=Oswald:wght@300;400;600;700&display=swap');
        
        body {
            background-color: #000000;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-header { font-family: 'Oswald', sans-serif; }
        
        /* Custom Animations */
        @keyframes pulse-orange {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 85, 0, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(255, 85, 0, 0); }
        }
        .animate-pulse-orange { animation: pulse-orange 2s infinite; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Sleek Button Styling */
        .btn-minimal {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #a0a0a0;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }
        .btn-minimal:active { transform: scale(0.97); }
        .btn-minimal.selected {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
            font-weight: 600;
        }

        .text-glow-orange { text-shadow: 0 0 20px rgba(255,85,0,0.6); }
        .text-glow-white { text-shadow: 0 0 20px rgba(255,255,255,0.4); }

        /* SVG Circular Timer */
        .timer-ring {
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        ::-webkit-scrollbar { width: 4px; display: none;}
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root" class="min-h-[100dvh] w-full relative z-10 flex flex-col"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- AUDIO ENGINES ---
        const SoundFX = {
            ctx: null,
            init: () => {
                if (!SoundFX.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) SoundFX.ctx = new AudioContext();
                }
                if (SoundFX.ctx && SoundFX.ctx.state === 'suspended') SoundFX.ctx.resume();
                return SoundFX.ctx;
            },
            play: (type) => {
                const ctx = SoundFX.init();
                if (!ctx) return;
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                switch (type) {
                    case 'BEEP': 
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(800, now);
                        gain.gain.setValueAtTime(0.5, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1);
                        break;
                    case 'GO': 
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(1200, now);
                        gain.gain.setValueAtTime(0.6, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                        osc.start(now); osc.stop(now + 0.5);
                        break;
                    case 'WORK': 
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                        gain.gain.setValueAtTime(0.5, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                        osc.start(now); osc.stop(now + 0.5);
                        break;
                    case 'REST': 
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(150, now);
                        osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                        gain.gain.setValueAtTime(0.6, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                        break;
                }
            }
        };

        const SpeechEngine = {
            prime: () => {
                if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance('');
                    u.volume = 0;
                    window.speechSynthesis.speak(u);
                }
            },
            speak: (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 1.05; 
                    utterance.pitch = 0.9; 
                    utterance.volume = 1;
                    window.speechSynthesis.speak(utterance);
                }
            }
        };

        const useWakeLock = () => {
            const [isLocked, setIsLocked] = useState(false);
            const wakeLockRef = useRef(null);

            const request = useCallback(async () => {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLockRef.current = await navigator.wakeLock.request('screen');
                        setIsLocked(true);
                        wakeLockRef.current.addEventListener('release', () => setIsLocked(false));
                    }
                } catch (err) {
                    console.error('Wake Lock error:', err);
                    setIsLocked(false);
                }
            }, []);

            const release = useCallback(async () => {
                if (wakeLockRef.current) {
                    await wakeLockRef.current.release();
                    wakeLockRef.current = null;
                    setIsLocked(false);
                }
            }, []);

            useEffect(() => {
                const handleVisibility = () => {
                    if (document.visibilityState === 'visible') request();
                };
                document.addEventListener('visibilitychange', handleVisibility);
                return () => {
                    release();
                    document.removeEventListener('visibilitychange', handleVisibility);
                };
            }, [request, release]);

            return { isLocked, request, release };
        };

        const Footer = () => (
            <div className="w-full text-center pb-6 pt-4 mt-auto">
                <span className="text-[10px] font-mono tracking-[0.4em] text-gray-500 uppercase opacity-60">
                    Adapt // Recover // Master
                </span>
            </div>
        );

        // --- EQUALIZER PROGRESS BAR ---
        // Generates segmented boxes that fill up based on elapsed time within a block.
        const Equalizer = ({ totalMinutes, currentMinute, isComplete }) => {
            // Colors inspired by audio equalizer (blue -> purple -> pink -> orange -> green)
            const colors = ['bg-eq-blue', 'bg-eq-purple', 'bg-eq-pink', 'bg-eq-orange', 'bg-eq-green'];
            
            const bars = Array.from({ length: totalMinutes }, (_, i) => {
                const isFilled = isComplete || i < currentMinute;
                const isCurrent = !isComplete && i === currentMinute;
                const colorClass = colors[Math.min(i, colors.length - 1)];
                
                return (
                    <div key={i} className="flex-1 flex flex-col justify-end items-center h-12 md:h-16 rounded-sm bg-gray-900 mx-0.5 overflow-hidden relative">
                        {isFilled && <div className={`w-full h-full ${colorClass} shadow-neon-white transition-all duration-500`}></div>}
                        {isCurrent && <div className={`w-full ${colorClass} animate-pulse absolute bottom-0 transition-all duration-1000`} style={{height: '40%'}}></div>}
                    </div>
                );
            });

            return (
                <div className="w-full max-w-sm mx-auto flex items-end justify-between px-2 py-4">
                    {bars}
                </div>
            );
        };

        // --- SETUP WIZARD (GATEWAY -> ENGINE) ---
        const SetupWizard = ({ onLaunch }) => {
            const [step, setStep] = useState(1);
            
            // ISO Configs
            const [splitSquatTime, setSplitSquatTime] = useState(2);
            const [splitSquatWeight, setSplitSquatWeight] = useState(false);
            
            const [pressUpTime, setPressUpTime] = useState(2);
            
            const [ankleHoldTime, setAnkleHoldTime] = useState(2);
            const [ankleHoldWeight, setAnkleHoldWeight] = useState(false);

            // Engine Configs
            const [engineType, setEngineType] = useState('Q&D'); 
            const [qdExercise, setQdExercise] = useState('B'); 
            const [qdProtocol, setQdProtocol] = useState('5/4');
            const [axeMins, setAxeMins] = useState(15);
            const [dfwMins, setDfwMins] = useState(20);
            const [dfwEquip, setDfwEquip] = useState('Double KB');
            const [dfwIntensity, setDfwIntensity] = useState('RPE 7 (Medium)');

            const handleNext = () => {
                if (step === 1 && splitSquatTime === 1 && !splitSquatWeight) return;
                if (step === 3 && ankleHoldTime === 1 && !ankleHoldWeight) return;
                setStep(s => s + 1);
            };

            const handleLaunch = () => {
                SpeechEngine.prime();
                SoundFX.init();

                const workoutPlan = [
                    { type: 'ISO', name: 'Split Squat', duration: splitSquatTime, weighted: splitSquatWeight },
                    { type: 'ISO', name: 'Press Up', duration: pressUpTime, weighted: false },
                    { type: 'ISO', name: 'Ankle Hold', duration: ankleHoldTime, weighted: ankleHoldWeight },
                    { 
                        type: 'ENGINE', 
                        name: engineType,
                        config: engineType === 'Q&D' 
                            ? { exercise: qdExercise, protocol: qdProtocol, seriesCount: 4 } // Defaulting series to 4 for simplicity
                            : engineType === 'AXE' 
                            ? { duration: axeMins } 
                            : { duration: dfwMins, equipment: dfwEquip, intensity: dfwIntensity }
                    }
                ];

                onLaunch(workoutPlan);
            };

            const renderIsoStep = (title, time, setTime, allowWeighted, isWeighted, setWeighted, stepNum) => {
                const times = allowWeighted ? [1, 2, 3, 4, 5] : [2, 3, 4, 5];
                const warning = time === 1 && allowWeighted && !isWeighted;
                
                return (
                    <div className="animate-fade-in flex flex-col h-full">
                        <div className="text-center mb-8">
                            <h2 className="text-gray-500 font-mono text-[10px] tracking-[0.2em] uppercase mb-1">Gateway Block {stepNum}/3</h2>
                            <h1 className="text-3xl font-header font-bold text-white uppercase">{title}</h1>
                        </div>

                        <label className="text-[10px] font-semibold text-gray-400 uppercase mb-3 block tracking-widest">Target Duration</label>
                        <div className="flex gap-2 mb-8">
                            {times.map(m => (
                                <button key={m} onClick={() => { setTime(m); if(m!==1 && allowWeighted) setWeighted(false); }} className={`btn-minimal flex-1 py-4 text-sm ${time === m ? 'selected' : ''}`}>{m}M</button>
                            ))}
                        </div>

                        {allowWeighted && time === 1 && (
                            <div className="mb-8 p-4 border border-brand-orange/30 rounded-xl bg-orange-900/10">
                                <div className="flex items-center justify-between cursor-pointer" onClick={() => setWeighted(!isWeighted)}>
                                    <div>
                                        <span className="text-xs font-semibold text-white uppercase tracking-widest block">Add Weight</span>
                                        <span className="text-[10px] text-gray-400 font-mono">Mandatory for 1 minute duration</span>
                                    </div>
                                    <div className={`w-12 h-6 rounded-full relative transition-all duration-300 ${isWeighted ? 'bg-brand-orange shadow-neon-orange' : 'bg-gray-800'}`}>
                                        <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all duration-300 ${isWeighted ? 'left-7' : 'left-1 shadow-sm'}`}></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="mt-auto pt-6 border-t border-white/10">
                            <button 
                                disabled={warning}
                                onClick={handleNext}
                                className="w-full py-4 bg-white text-black font-semibold text-xs uppercase tracking-widest rounded-xl hover:scale-[1.02] disabled:opacity-30 disabled:scale-100 transition-all duration-300 shadow-lg"
                            >
                                Confirm & Proceed
                            </button>
                        </div>
                    </div>
                );
            };

            const renderEngineStep = () => (
                <div className="animate-fade-in flex flex-col h-full">
                    <div className="text-center mb-8">
                        <h2 className="text-gray-500 font-mono text-[10px] tracking-[0.2em] uppercase mb-1">Final Block 4/4</h2>
                        <h1 className="text-3xl font-header font-bold text-brand-orange text-glow-orange uppercase">Select Engine</h1>
                    </div>

                    <div className="flex gap-2 border-b border-white/10 overflow-x-auto pb-2 scrollbar-hide mb-6">
                        {['Q&D', 'AXE', 'DFW'].map(tab => (
                            <button key={tab} onClick={() => setEngineType(tab)} className={`text-xs md:text-sm font-header uppercase tracking-widest whitespace-nowrap flex-1 text-center py-2 transition-all ${engineType === tab ? 'text-white border-b-2 border-brand-orange' : 'text-gray-600 hover:text-gray-400'}`}>
                                {tab}
                            </button>
                        ))}
                    </div>

                    {engineType === 'Q&D' && (
                        <div className="space-y-6 animate-fade-in">
                            <div>
                                <label className="text-[10px] font-semibold text-gray-400 uppercase mb-3 block tracking-widest">Movement Pattern</label>
                                <div className="flex gap-2">
                                    <button onClick={() => setQdExercise('A')} className={`btn-minimal flex-1 py-4 text-xs ${qdExercise === 'A' ? 'selected' : ''}`}>Swings + Pushups</button>
                                    <button onClick={() => setQdExercise('B')} className={`btn-minimal flex-1 py-4 text-xs ${qdExercise === 'B' ? 'selected' : ''}`}>Snatch (L/R)</button>
                                </div>
                            </div>
                            <div>
                                <label className="text-[10px] font-semibold text-gray-400 uppercase mb-3 block tracking-widest">Protocol</label>
                                <div className="flex gap-2">
                                    <button onClick={() => setQdProtocol('5/4')} className={`btn-minimal flex-1 py-3 ${qdProtocol === '5/4' ? 'selected' : ''}`}>
                                        <span className="text-sm font-header block">5/4</span><span className="text-[10px] opacity-70">Power</span>
                                    </button>
                                    <button onClick={() => setQdProtocol('10/2')} className={`btn-minimal flex-1 py-3 ${qdProtocol === '10/2' ? 'selected' : ''}`}>
                                        <span className="text-sm font-header block">10/2</span><span className="text-[10px] opacity-70">Mass</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {engineType === 'AXE' && (
                        <div className="space-y-6 animate-fade-in">
                            <label className="text-[10px] font-semibold text-gray-400 uppercase mb-3 block tracking-widest">EMOM Duration</label>
                            <div className="flex gap-2">
                                {[10, 15, 20, 30].map(m => (
                                    <button key={m} onClick={() => setAxeMins(m)} className={`btn-minimal flex-1 py-4 text-sm ${axeMins === m ? 'selected' : ''}`}>{m}M</button>
                                ))}
                            </div>
                        </div>
                    )}

                    {engineType === 'DFW' && (
                        <div className="space-y-6 animate-fade-in">
                            <div>
                                <label className="text-[10px] font-semibold text-gray-400 uppercase mb-3 block tracking-widest">Time Domain</label>
                                <div className="flex gap-2">
                                    {[20, 30].map(m => (
                                        <button key={m} onClick={() => setDfwMins(m)} className={`btn-minimal flex-1 py-4 text-sm ${dfwMins === m ? 'selected' : ''}`}>{m}M</button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <label className="text-[10px] font-semibold text-gray-400 uppercase mb-3 block tracking-widest">Equipment & Intensity</label>
                                <div className="flex flex-col gap-2">
                                    <div className="flex gap-2">
                                        {['Single KB', 'Double KB'].map(e => (
                                            <button key={e} onClick={() => setDfwEquip(e)} className={`btn-minimal flex-1 py-3 text-xs ${dfwEquip === e ? 'selected' : ''}`}>{e}</button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2 mt-2">
                                        {['RPE 5 (Light)', 'RPE 7 (Medium)', 'RPE 8 (Heavy)'].map(i => (
                                            <button key={i} onClick={() => setDfwIntensity(i)} className={`btn-minimal flex-1 py-3 text-[10px] ${dfwIntensity === i ? 'selected' : ''}`}>{i.split(' ')[0]}</button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="mt-auto pt-6 border-t border-white/10">
                        <button onClick={handleLaunch} className="w-full py-4 bg-brand-orange text-white font-semibold text-xs uppercase tracking-widest rounded-xl hover:bg-[#ff7700] hover:shadow-neon-orange transition-all duration-300">
                            Execute Protocol
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="h-full flex flex-col p-6 max-w-lg mx-auto w-full z-20 relative bg-black">
                    <div className="flex justify-center mb-6">
                        <img src="STAMPS NLCP Logo .jpg" alt="NLC Logo" className="w-16 h-16 rounded-full border border-white/10 shadow-[0_0_15px_rgba(255,255,255,0.1)] object-cover" />
                    </div>
                    {step === 1 && renderIsoStep("Split Squat", splitSquatTime, setSplitSquatTime, true, splitSquatWeight, setSplitSquatWeight, 1)}
                    {step === 2 && renderIsoStep("Press Up", pressUpTime, setPressUpTime, false, false, () => {}, 2)}
                    {step === 3 && renderIsoStep("Ankle Hold", ankleHoldTime, setAnkleHoldTime, true, ankleHoldWeight, setAnkleHoldWeight, 3)}
                    {step === 4 && renderEngineStep()}
                </div>
            );
        };

        // --- ACTIVE SESSION ---
        const ActiveSession = ({ plan, onFinish, onCancel }) => {
            const [stageIndex, setStageIndex] = useState(0);
            const currentStage = plan[stageIndex];
            
            const [time, setTime] = useState(0); 
            const [globalStatus, setGlobalStatus] = useState('COUNTDOWN'); // COUNTDOWN, ACTIVE, PAUSED
            const [countdown, setCountdown] = useState(3);
            const [show5MinPrompt, setShow5MinPrompt] = useState(false);
            
            // Sub-block states for specific Engines
            const [engineBlock, setEngineBlock] = useState('READY');
            const [qdSeries, setQdSeries] = useState(1);
            
            const intervalRef = useRef(null);
            const { isLocked, request: requestLock } = useWakeLock();

            // Total target duration in seconds for current stage
            const getTargetSeconds = () => {
                if (currentStage.type === 'ISO') return currentStage.duration * 60;
                if (currentStage.type === 'ENGINE') {
                    if (currentStage.name === 'Q&D') {
                        return currentStage.config.exercise === 'A' ? 180 * currentStage.config.seriesCount : 240 * currentStage.config.seriesCount;
                    }
                    return currentStage.config.duration * 60;
                }
                return 0;
            };

            const targetSeconds = getTargetSeconds();
            const remaining = Math.max(0, targetSeconds - time);

            useEffect(() => {
                requestLock();
            }, [requestLock]);

            // Timer Loop
            useEffect(() => {
                if (globalStatus === 'COUNTDOWN') {
                    intervalRef.current = setInterval(() => {
                        setCountdown(c => {
                            if (c > 1) {
                                SoundFX.play('BEEP');
                                return c - 1;
                            }
                            clearInterval(intervalRef.current);
                            SoundFX.play('GO');
                            setGlobalStatus('ACTIVE');
                            SpeechEngine.speak(currentStage.type === 'ISO' ? `${currentStage.name}. Hold position.` : `Engine block. ${currentStage.name}. Go.`);
                            return 0;
                        });
                    }, 1000);
                } else if (globalStatus === 'ACTIVE') {
                    intervalRef.current = setInterval(() => {
                        setTime(t => t + 1);
                    }, 1000);
                } else {
                    clearInterval(intervalRef.current);
                }
                return () => clearInterval(intervalRef.current);
            }, [globalStatus, currentStage]);

            // Logic per second
            useEffect(() => {
                if (globalStatus !== 'ACTIVE') return;

                // 5 Minute Warning for Long Engine Blocks
                if (currentStage.type === 'ENGINE' && currentStage.name !== 'Q&D' && remaining === 300) {
                    SpeechEngine.speak("Focus on technique, keep your skills sharp.");
                    setShow5MinPrompt(true);
                    setTimeout(() => setShow5MinPrompt(false), 8000);
                }

                // Completion check
                if (time >= targetSeconds && targetSeconds > 0) {
                    if (stageIndex < plan.length - 1) {
                        setGlobalStatus('COUNTDOWN');
                        setCountdown(3);
                        setTime(0);
                        setStageIndex(i => i + 1);
                        SpeechEngine.speak("Block complete. Prepare for next.");
                    } else {
                        setGlobalStatus('COMPLETE');
                        SpeechEngine.speak("Workout complete. Outstanding effort.");
                        onFinish();
                    }
                    return;
                }

                // Q&D Sub-logic
                if (currentStage.type === 'ENGINE' && currentStage.name === 'Q&D') {
                    const SERIES_DUR = currentStage.config.exercise === 'A' ? 180 : 240;
                    const timeInSeries = time % SERIES_DUR;
                    const triggers = currentStage.config.protocol === '5/4' ? [0, 30, 60, 90] : [0, 60];
                    const deepRest = currentStage.config.protocol === '5/4' ? 120 : 90;
                    
                    if (time > 0 && timeInSeries === 0) setQdSeries(s => s + 1);

                    if (triggers.includes(timeInSeries)) {
                        setEngineBlock('WORK');
                        SoundFX.play('WORK');
                    } else if (timeInSeries >= deepRest) {
                        setEngineBlock('DEEP REST');
                    } else {
                        const timeSinceTrigger = Math.min(...triggers.map(t => timeInSeries - t).filter(d => d >= 0));
                        if (timeSinceTrigger === 20 && engineBlock === 'WORK') {
                            setEngineBlock('RECOVER');
                            SoundFX.play('REST');
                        }
                    }
                    
                    const nextTrigger = triggers.find(t => t > timeInSeries) || SERIES_DUR;
                    if (nextTrigger - timeInSeries <= 3 && nextTrigger - timeInSeries > 0) SoundFX.play('BEEP');
                }

                // AXE Sub-logic
                if (currentStage.type === 'ENGINE' && currentStage.name === 'AXE') {
                    const emomTime = time % 60;
                    if (emomTime === 55) SpeechEngine.speak("Five seconds.");
                    if (emomTime === 0 && time > 0) { setEngineBlock('WORK'); SoundFX.play('WORK'); }
                    if (emomTime === 8) setEngineBlock('REST');
                    if (emomTime > 56 && emomTime < 60) SoundFX.play('BEEP');
                }
            }, [time, globalStatus, currentStage, remaining, targetSeconds, stageIndex, plan.length, onFinish, engineBlock]);

            const formatTime = (s) => `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;
            const progressPct = targetSeconds > 0 ? (time / targetSeconds) * 100 : 0;
            
            // Equalizer Calcs
            const totalMinutes = Math.ceil(targetSeconds / 60);
            const currentMinute = Math.floor(time / 60);

            return (
                <div className="h-full flex flex-col items-center justify-between p-6 max-w-lg mx-auto w-full relative z-20 bg-black">
                    
                    {/* Header */}
                    <div className="w-full flex justify-between items-center mb-4">
                        <div className="flex items-center gap-3">
                            <img src="STAMPS NLCP Logo .jpg" alt="Logo" className="w-10 h-10 rounded-full border border-white/10" />
                            <div>
                                <h2 className="text-white font-header text-lg uppercase leading-none">{currentStage.name}</h2>
                                <p className="text-[10px] font-mono text-brand-orange uppercase tracking-widest">{currentStage.type} PHASE {stageIndex + 1}/{plan.length}</p>
                            </div>
                        </div>
                        {currentStage.weighted && <span className="text-[10px] bg-white text-black px-2 py-1 rounded-sm font-bold uppercase tracking-widest">Weighted</span>}
                    </div>

                    {/* Equalizer (Checking Boxes) */}
                    <div className="w-full mb-8">
                        <Equalizer totalMinutes={totalMinutes} currentMinute={currentMinute} isComplete={globalStatus === 'COMPLETE'} />
                        <div className="text-center mt-2 text-[10px] font-mono text-gray-500 uppercase tracking-widest">Progress Tracker</div>
                    </div>

                    {/* Main UI Area */}
                    <div className="flex-1 flex flex-col items-center justify-center relative w-full">
                        
                        {/* 5 Min Overlay */}
                        {show5MinPrompt && (
                            <div className="absolute top-0 left-0 w-full z-50 animate-scale-in text-center p-4 bg-brand-orange/20 border border-brand-orange rounded-xl backdrop-blur-md shadow-neon-orange">
                                <p className="text-white font-header text-xl uppercase italic tracking-wide">"Focus on technique.</p>
                                <p className="text-white font-header text-xl uppercase italic tracking-wide">Keep your skills sharp."</p>
                            </div>
                        )}

                        {globalStatus === 'COUNTDOWN' ? (
                            <div className="animate-scale-in flex flex-col items-center">
                                <div className="text-9xl font-header font-bold text-white text-glow-white mb-4">{countdown}</div>
                                <div className="text-brand-orange tracking-[0.3em] uppercase text-sm font-semibold">Prepare to execute</div>
                            </div>
                        ) : (
                            <div className="relative flex items-center justify-center animate-fade-in w-64 h-64 sm:w-80 sm:h-80">
                                {/* SVG Circular Progress */}
                                <svg className="absolute inset-0 w-full h-full" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="45" fill="none" stroke="#111" strokeWidth="2" />
                                    <circle 
                                        cx="50" cy="50" r="45" fill="none" 
                                        stroke={currentStage.type === 'ENGINE' ? '#fff' : '#ff5500'} 
                                        strokeWidth="4" 
                                        strokeLinecap="round"
                                        className="timer-ring"
                                        strokeDasharray="283"
                                        strokeDashoffset={283 - (283 * progressPct) / 100}
                                    />
                                </svg>
                                
                                {/* Inner Text */}
                                <div className="flex flex-col items-center justify-center z-10 text-center">
                                    <div className="text-6xl sm:text-7xl font-mono font-bold text-white tracking-tighter" style={{ fontVariantNumeric: 'tabular-nums' }}>
                                        {formatTime(remaining)}
                                    </div>
                                    
                                    {currentStage.type === 'ENGINE' && (
                                        <div className="mt-4">
                                            <div className={`text-xl sm:text-2xl font-header uppercase italic font-bold tracking-widest ${engineBlock === 'WORK' ? 'text-brand-orange text-glow-orange' : 'text-gray-400'}`}>
                                                {engineBlock}
                                            </div>
                                            {currentStage.name === 'Q&D' && <div className="text-xs text-gray-500 font-mono mt-1">SERIES {qdSeries} / {currentStage.config.seriesCount}</div>}
                                            {currentStage.name === 'AXE' && <div className="text-xs text-gray-500 font-mono mt-1">EMOM / {currentStage.config.duration}M</div>}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Controls */}
                    <div className="w-full mt-8">
                        <div className="flex gap-4 mb-4">
                            <button 
                                onClick={() => setGlobalStatus(globalStatus === 'ACTIVE' ? 'PAUSED' : 'ACTIVE')} 
                                disabled={globalStatus === 'COUNTDOWN'}
                                className={`flex-1 py-4 font-bold uppercase tracking-widest text-xs rounded-xl transition-all border ${globalStatus === 'ACTIVE' ? 'bg-black text-white border-white/20 hover:bg-white/10' : 'bg-white text-black border-white hover:bg-gray-200 shadow-neon-white'}`}
                            >
                                {globalStatus === 'ACTIVE' ? 'Pause' : 'Resume'}
                            </button>
                        </div>
                        <div className="text-center">
                            <button onClick={onCancel} className="text-[10px] font-semibold text-gray-500 uppercase tracking-widest hover:text-white px-6 py-2 transition-colors underline">
                                Abort Workout
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- SUMMARY ---
        const Summary = ({ onReset }) => (
            <div className="h-full flex flex-col p-6 max-w-lg mx-auto w-full justify-center text-center animate-fade-in z-20 relative bg-black">
                <img src="STAMPS NLCP Logo .jpg" alt="NLC Logo" className="w-24 h-24 mx-auto rounded-full ring-2 ring-white/10 mb-8 object-cover shadow-[0_0_30px_rgba(255,255,255,0.1)]" />
                <h1 className="text-4xl sm:text-5xl font-header font-bold text-white mb-2 uppercase tracking-wide text-glow-white">Mission<br/>Accomplished</h1>
                <p className="text-brand-orange font-mono text-xs uppercase tracking-widest mb-12">All parameters successfully executed.</p>
                
                <button onClick={onReset} className="w-full max-w-xs mx-auto py-4 bg-white text-black font-bold uppercase text-xs tracking-widest rounded-xl hover:scale-[1.02] transition-all shadow-lg">
                    Return to Gateway
                </button>
                <Footer />
            </div>
        );

        // --- APP ROOT ---
        const App = () => {
            const [view, setView] = useState('SETUP'); 
            const [plan, setPlan] = useState([]);

            const handleLaunch = (workoutPlan) => {
                setPlan(workoutPlan);
                setView('WORKOUT');
            };

            const handleFinish = () => setView('SUMMARY');
            const handleCancel = () => setView('SETUP');

            return (
                <div className="w-full h-full bg-black">
                    {view === 'SETUP' && <SetupWizard onLaunch={handleLaunch} />}
                    {view === 'WORKOUT' && <ActiveSession plan={plan} onFinish={handleFinish} onCancel={handleCancel} />}
                    {view === 'SUMMARY' && <Summary onReset={handleCancel} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
